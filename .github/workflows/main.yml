          cat > app/src/main/java/com/tayo/dupecleaner/Scanner.kt <<'__EOF__'
          package com.tayo.dupecleaner

          import android.content.ContentResolver
          import android.content.ContentUris
          import android.net.Uri
          import android.os.Environment
          import android.provider.MediaStore
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import java.io.File
          import java.io.InputStream
          import java.security.MessageDigest

          enum class Kind(val label: String) {
              PHOTOS("Photos"),
              VIDEOS("Videos"),
              MUSIC("Music"),
              DOCS("Documents"),
              LARGE("Large files"),
              WHATSAPP("WhatsApp"),
              JUNK("Junk")
          }

          // The six shown as swipeable tabs. JUNK is reached via the overflow menu instead.
          val tabKinds = listOf(Kind.PHOTOS, Kind.VIDEOS, Kind.MUSIC, Kind.DOCS, Kind.LARGE, Kind.WHATSAPP)

          val visualExt = setOf(
              "jpg", "jpeg", "png", "webp", "gif", "bmp", "heic",
              "mp4", "mkv", "3gp", "mov", "avi", "webm"
          )

          data class FileItem(
              val uri: Uri,
              val path: String?,
              val name: String,
              val size: Long,
              val date: Long,
              val kind: Kind,
              val category: String = "",
              val sent: Boolean = false,
              val isDir: Boolean = false
          ) {
              val key: String = uri.toString()
              val ext: String = name.substringAfterLast('.', "").lowercase()
              val isVisual: Boolean get() = ext in visualExt
          }

          data class DupGroup(val size: Long, val items: List<FileItem>)

          data class AppStorageInfo(
              val packageName: String,
              val label: String,
              val appBytes: Long,
              val dataBytes: Long,
              val cacheBytes: Long
          ) {
              val totalBytes: Long get() = appBytes + dataBytes + cacheBytes
          }

          object Scanner {

              const val BIN_NAME = "DupeCleaner Recycle Bin"

              private val docExt = setOf(
                  "pdf", "doc", "docx", "xls", "xlsx", "ppt", "pptx",
                  "txt", "csv", "rtf", "odt", "epub"
              )

              // Places WhatsApp / WhatsApp Business keep received and sent media.
              private val waRoots = listOf(
                  "Android/media/com.whatsapp/WhatsApp/Media",
                  "WhatsApp/Media",
                  "Android/media/com.whatsapp.w4b/WhatsApp Business/Media",
                  "WhatsApp Business/Media"
              )

              private fun fileItem(f: File, kind: Kind): FileItem = FileItem(
                  uri = Uri.fromFile(f),
                  path = f.absolutePath,
                  name = f.name,
                  size = f.length(),
                  date = f.lastModified() / 1000,
                  kind = kind
              )

              fun listMedia(cr: ContentResolver, kind: Kind): List<FileItem> {
                  val base: Uri = when (kind) {
                      Kind.PHOTOS -> MediaStore.Images.Media.EXTERNAL_CONTENT_URI
                      Kind.MUSIC -> MediaStore.Audio.Media.EXTERNAL_CONTENT_URI
                      else -> MediaStore.Video.Media.EXTERNAL_CONTENT_URI
                  }
                  val proj = arrayOf(
                      MediaStore.MediaColumns._ID,
                      MediaStore.MediaColumns.DISPLAY_NAME,
                      MediaStore.MediaColumns.SIZE,
                      MediaStore.MediaColumns.DATE_ADDED
                  )
                  val out = ArrayList<FileItem>()
                  cr.query(base, proj, null, null, null)?.use { c ->
                      val iId = c.getColumnIndexOrThrow(MediaStore.MediaColumns._ID)
                      val iName = c.getColumnIndexOrThrow(MediaStore.MediaColumns.DISPLAY_NAME)
                      val iSize = c.getColumnIndexOrThrow(MediaStore.MediaColumns.SIZE)
                      val iDate = c.getColumnIndexOrThrow(MediaStore.MediaColumns.DATE_ADDED)
                      while (c.moveToNext()) {
                          val size = c.getLong(iSize)
                          if (size <= 0L) continue
                          val uri = ContentUris.withAppendedId(base, c.getLong(iId))
                          out.add(
                              FileItem(
                                  uri = uri,
                                  path = null,
                                  name = c.getString(iName) ?: "file",
                                  size = size,
                                  date = c.getLong(iDate),
                                  kind = kind
                              )
                          )
                      }
                  }
                  return out
              }

              fun listDocs(): List<FileItem> {
                  val root = Environment.getExternalStorageDirectory()
                  val androidDir = File(root, "Android").absolutePath
                  val out = ArrayList<FileItem>()
                  root.walkTopDown()
                      .onEnter { dir ->
                          !dir.name.startsWith(".") &&
                              dir.name != BIN_NAME &&
                              dir.absolutePath != androidDir
                      }
                      .filter { it.isFile && it.extension.lowercase() in docExt && it.length() > 0L }
                      .forEach {
                          out.add(
                              FileItem(
                                  uri = Uri.fromFile(it),
                                  path = it.absolutePath,
                                  name = it.name,
                                  size = it.length(),
                                  date = it.lastModified() / 1000,
                                  kind = Kind.DOCS
                              )
                          )
                      }
                  return out
              }

              // Folders the large-files scan must never enter (app data, our bin, WhatsApp chat backups).
              private fun skipForLarge(root: File, dir: File): Boolean {
                  val p = dir.absolutePath
                  if (dir.name == BIN_NAME) return true
                  if (p == File(root, "Android/data").absolutePath) return true
                  if (p == File(root, "Android/obb").absolutePath) return true
                  if (p.contains("/WhatsApp") && (dir.name == "Backups" || dir.name == "Databases")) return true
                  return false
              }

              // Every file of at least minBytes, biggest first.
              fun listLarge(minBytes: Long): List<FileItem> {
                  val root = Environment.getExternalStorageDirectory()
                  val out = ArrayList<FileItem>()
                  root.walkTopDown()
                      .onEnter { dir -> !dir.name.startsWith(".") && !skipForLarge(root, dir) }
                      .filter { it.isFile && it.length() >= minBytes }
                      .forEach { out.add(fileItem(it, Kind.LARGE)) }
                  out.sortByDescending { it.size }
                  return out
              }

              private fun waCategory(folder: String): String = when {
                  folder.startsWith(".Statuses") -> "Statuses"
                  folder.contains("Voice Notes") -> "Voice notes"
                  folder.contains("Animated Gifs") -> "GIFs"
                  folder.contains("Sticker") -> "Stickers"
                  folder.contains("Images") -> "Images"
                  folder.contains("Video") -> "Videos"
                  folder.contains("Audio") -> "Audio"
                  folder.contains("Documents") -> "Documents"
                  else -> "Other"
              }

              // WhatsApp media only (never chat databases or backups), biggest first.
              fun listWhatsApp(): List<FileItem> {
                  val root = Environment.getExternalStorageDirectory()
                  val out = ArrayList<FileItem>()
                  for (rel in waRoots) {
                      val media = File(root, rel)
                      if (!media.isDirectory) continue
                      media.walkTopDown()
                          .filter { it.isFile && it.length() > 0L && it.name != ".nomedia" }
                          .forEach { f ->
                              val parts = f.relativeTo(media).path.split(File.separatorChar)
                              out.add(
                                  fileItem(f, Kind.WHATSAPP).copy(
                                      category = waCategory(parts.firstOrNull() ?: ""),
                                      sent = parts.contains("Sent")
                                  )
                              )
                          }
                  }
                  return out.distinctBy { it.key }.sortedByDescending { it.size }
              }

              private val thumbDirNames = setOf(".thumbnails", "thumbnails", "thumbcache", ".cache")

              // A folder counts as "junk" only if nothing but junk lives under it, so we never
              // suggest deleting a folder that also holds a file the user actually wants.
              private fun isEmptyOfRealFiles(dir: File): Boolean {
                  val kids = dir.listFiles() ?: return true
                  for (k in kids) {
                      if (k.isFile) return false
                      if (k.isDirectory && !isEmptyOfRealFiles(k)) return false
                  }
                  return true
              }

              private fun dirSize(dir: File): Long =
                  dir.walkTopDown().filter { it.isFile }.sumOf { it.length() }

              // Zero-byte files, stray .apk installers in Download, thumbnail/cache folders,
              // and folders left empty after other cleanups. Never touches Android/data,
              // Android/obb, our own recycle bin, or WhatsApp's chat backups.
              fun listJunk(): List<FileItem> {
                  val root = Environment.getExternalStorageDirectory()
                  val downloadDir = File(root, "Download")
                  val out = ArrayList<FileItem>()
                  val thumbRoots = ArrayList<File>()

                  root.walkTopDown()
                      .onEnter { dir -> !dir.name.startsWith(".") && !skipForLarge(root, dir) }
                      .forEach { f ->
                          if (f.isDirectory && f.name.lowercase() in thumbDirNames) {
                              thumbRoots.add(f)
                              return@forEach
                          }
                          if (thumbRoots.any { f.absolutePath.startsWith(it.absolutePath + File.separator) }) {
                              return@forEach
                          }
                          if (f.isFile) {
                              if (f.length() == 0L) {
                                  out.add(fileItem(f, Kind.JUNK).copy(category = "Zero-byte files"))
                              } else if (
                                  f.extension.lowercase() == "apk" &&
                                  f.absolutePath.startsWith(downloadDir.absolutePath + File.separator)
                              ) {
                                  out.add(fileItem(f, Kind.JUNK).copy(category = "Leftover installers (.apk)"))
                              }
                          }
                      }

                  for (t in thumbRoots) {
                      val size = dirSize(t)
                      if (size > 0L) {
                          out.add(
                              FileItem(
                                  uri = Uri.fromFile(t),
                                  path = t.absolutePath,
                                  name = t.name,
                                  size = size,
                                  date = t.lastModified() / 1000,
                                  kind = Kind.JUNK,
                                  category = "Thumbnail cache",
                                  isDir = true
                              )
                          )
                      }
                  }

                  root.walkTopDown()
                      .onEnter { dir -> !dir.name.startsWith(".") && !skipForLarge(root, dir) && dir != root }
                      .filter { it.isDirectory && it != root && isEmptyOfRealFiles(it) }
                      .forEach {
                          out.add(
                              FileItem(
                                  uri = Uri.fromFile(it),
                                  path = it.absolutePath,
                                  name = it.name,
                                  size = 0L,
                                  date = it.lastModified() / 1000,
                                  kind = Kind.JUNK,
                                  category = "Empty folders",
                                  isDir = true
                              )
                          )
                      }

                  return out.sortedByDescending { it.size }
              }

              fun deletePath(item: FileItem): Boolean {
                  val p = item.path ?: return false
                  return try {
                      val f = File(p)
                      if (item.isDir || f.isDirectory) f.deleteRecursively() else f.delete()
                  } catch (e: Exception) {
                      false
                  }
              }

              // Files have no system trash, so "recycle bin" = a folder we move them into.
              // Folders (thumbnail caches, empty folders) are junk by definition, so they are
              // always removed outright rather than moved -- there is nothing worth restoring.
              fun moveToBin(item: FileItem): Boolean {
                  if (item.isDir) return deletePath(item)
                  val p = item.path ?: return false
                  return try {
                      val src = File(p)
                      val bin = File(Environment.getExternalStorageDirectory(), BIN_NAME)
                      bin.mkdirs()
                      val hide = File(bin, ".nomedia")
                      if (!hide.exists()) hide.createNewFile()
                      val base = item.name.substringBeforeLast('.', item.name)
                      val ext = item.name.substringAfterLast('.', "")
                      var dest = File(bin, item.name)
                      var i = 1
                      while (dest.exists()) {
                          dest = File(bin, if (ext.isEmpty()) "${base}_$i" else "${base}_$i.$ext")
                          i++
                      }
                      if (!src.renameTo(dest)) {
                          src.copyTo(dest)
                          src.delete()
                      }
                      true
                  } catch (e: Exception) {
                      false
                  }
              }

              private fun openStream(cr: ContentResolver, item: FileItem): InputStream? {
                  val p = item.path
                  return if (p != null) File(p).inputStream() else cr.openInputStream(item.uri)
              }

              // Hashes the first `limit` bytes (use Long.MAX_VALUE for the whole file).
              private fun hash(cr: ContentResolver, item: FileItem, limit: Long): String? {
                  return try {
                      val md = MessageDigest.getInstance("SHA-256")
                      val stream = openStream(cr, item) ?: return null
                      stream.use { ins ->
                          val buf = ByteArray(1 shl 20)
                          var left = limit
                          while (left > 0L) {
                              val want = if (left < buf.size.toLong()) left.toInt() else buf.size
                              val n = ins.read(buf, 0, want)
                              if (n < 0) break
                              md.update(buf, 0, n)
                              left -= n.toLong()
                          }
                      }
                      md.digest().joinToString("") { "%02x".format(it) }
                  } catch (e: Exception) {
                      null
                  }
              }

              // Per-app storage, biggest first: app (APK/install size), data (files the app has
              // saved -- downloads, databases, offline media) and cache (temp files), each
              // reported separately via StorageStatsManager so this works without needing
              // access to another app's private folders, which Android blocks outright.
              // Android does not let a normal app clear another app's storage -- this only
              // reads sizes so the user can jump straight to the right app's Settings page.
              fun listAppStorage(ctx: android.content.Context): List<AppStorageInfo> {
                  val pm = ctx.packageManager
                  val stats = ctx.getSystemService(android.app.usage.StorageStatsManager::class.java)
                      ?: return emptyList()
                  val out = ArrayList<AppStorageInfo>()
                  for (appInfo in pm.getInstalledApplications(0)) {
                      try {
                          val s = stats.queryStatsForUid(appInfo.storageUuid, appInfo.uid)
                          val total = s.appBytes + s.dataBytes + s.cacheBytes
                          if (total > 0L) {
                              out.add(
                                  AppStorageInfo(
                                      packageName = appInfo.packageName,
                                      label = pm.getApplicationLabel(appInfo).toString(),
                                      appBytes = s.appBytes,
                                      dataBytes = s.dataBytes,
                                      cacheBytes = s.cacheBytes
                                  )
                              )
                          }
                      } catch (e: Exception) {
                          // Some system UIDs refuse this query -- skip them.
                      }
                  }
                  return out.distinctBy { it.packageName }.sortedByDescending { it.totalBytes }
              }

              // Step 1: same size. Step 2: same first 64 KB. Step 3: same full SHA-256.
              suspend fun findDuplicates(
                  cr: ContentResolver,
                  items: List<FileItem>,
                  onProgress: (Int, Int) -> Unit
              ): List<DupGroup> = withContext(Dispatchers.IO) {
                  val sizeGroups = items.groupBy { it.size }.values.filter { it.size > 1 }
                  val total = sizeGroups.sumOf { it.size }
                  var done = 0
                  val result = ArrayList<DupGroup>()
                  for (sg in sizeGroups) {
                      val quick = sg.groupBy { hash(cr, it, 64L * 1024L) }
                          .filterKeys { it != null }
                          .values.filter { it.size > 1 }
                      for (qg in quick) {
                          val full = qg.groupBy { hash(cr, it, Long.MAX_VALUE) }
                              .filterKeys { it != null }
                              .values.filter { it.size > 1 }
                          for (g in full) {
                              result.add(DupGroup(g[0].size, g.sortedBy { it.date }))
                          }
                      }
                      done += sg.size
                      onProgress(done, total)
                  }
                  result.sortedByDescending { it.size * (it.items.size - 1) }
              }
          }
