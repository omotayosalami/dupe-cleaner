          class MainVM : ViewModel() {
              var kind by mutableStateOf(Kind.PHOTOS)
              var results by mutableStateOf<Map<Kind, List<DupGroup>>>(emptyMap())
              var selected by mutableStateOf<Set<String>>(emptySet())
              var scanning by mutableStateOf(false)
              var progress by mutableStateOf("")
              var pending: List<FileItem> = emptyList()
              var pendingTrash: Boolean = false

              val groups: List<DupGroup> get() = results[kind] ?: emptyList()
              val scanned: Boolean get() = results.containsKey(kind)

              fun scan(cr: ContentResolver) {
