                  "cache" -> "App storage"
                  "dashboard" -> "Storage dashboard"
                  else -> null
              }

              Scaffold(
                  topBar = {
                      Column {
                          Row(
                              Modifier.fillMaxWidth().padding(horizontal = 16.dp, vertical = 12.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              if (overlayTitle != null) {
                                  IconButton(onClick = { vm.overlay = null }) {
                                      Icon(Icons.Filled.ArrowBack, contentDescription = "Back")
                                  }
                              }
                              Column(Modifier.weight(1f)) {
                                  Text(
                                      overlayTitle ?: "Dupe Cleaner",
                                      fontSize = 22.sp,
                                      fontWeight = FontWeight.Bold
                                  )
                                  if (subtitle != null) {
                                      Text(subtitle, fontSize = 13.sp, color = Color.Gray)
                                  }
                              }
                              if (overlayTitle == null) {
                                  Box {
                                      IconButton(onClick = { vm.menuOpen = true }) {
                                          Icon(Icons.Filled.MoreVert, contentDescription = "More")
                                      }
                                      DropdownMenu(
                                          expanded = vm.menuOpen,
                                          onDismissRequest = { vm.menuOpen = false }
                                      ) {
                                          DropdownMenuItem(
                                              text = { Text("Junk files") },
                                              onClick = { vm.menuOpen = false; vm.overlay = "junk" }
                                          )
                                          DropdownMenuItem(
                                              text = { Text("App storage") },
                                              onClick = { vm.menuOpen = false; vm.overlay = "cache" }
                                          )
                                          DropdownMenuItem(
                                              text = { Text("Storage dashboard") },
                                              onClick = { vm.menuOpen = false; vm.overlay = "dashboard" }
                                          )
                                      }
                                  }
                              }
                          }
                          if (overlayTitle == null) {
                              ScrollableTabRow(selectedTabIndex = vm.kind.ordinal, edgePadding = 8.dp) {
                                  tabKinds.forEach { k ->
                                      Tab(
                                          selected = vm.kind == k,
                                          onClick = { vm.kind = k },
                                          text = { Text(k.label) }
                                      )
                                  }
                              }
                          }
                      }
                  },
                  bottomBar = {
                      if (hasList && !vm.scanning) {
                          Button(
                              onClick = { confirm = true },
                              enabled = toDelete.isNotEmpty(),
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(12.dp)
                                  .height(64.dp)
                          ) {
                              Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                  Text(
                                      "Delete ${toDelete.size} $noun",
                                      fontSize = 17.sp,
                                      fontWeight = FontWeight.Bold
                                  )
                                  Text("($verb ${fmt(toDelete.sumOf { it.size })})", fontSize = 13.sp)
                              }
                          }
                      }
                  }
              ) { pad ->
                  Box(Modifier.padding(pad).fillMaxSize()) {
                      when {
                          vm.scanning -> Column(
                              Modifier.fillMaxSize(),
                              verticalArrangement = Arrangement.Center,
                              horizontalAlignment = Alignment.CenterHorizontally
                          ) {
                              CircularProgressIndicator()
                              Spacer(Modifier.height(16.dp))
                              Text(vm.progress)
                          }

                          vm.overlay == "junk" ->
                              JunkView(vm, junkVisible, loader) { startScan() }

                          vm.overlay == "cache" ->
                              CacheView(vm) { vm.loadCacheApps(ctx) }

                          vm.overlay == "dashboard" ->
                              DashboardView(vm) { vm.loadDashboard(ctx) }

                          vm.kind == Kind.LARGE ->
                              LargeView(vm, largeVisible, loader) { startScan() }

                          vm.kind == Kind.WHATSAPP ->
                              WhatsAppView(vm, waBase, waVisible, loader) { startScan() }

                          !vm.scanned -> Column(
                              Modifier.fillMaxSize().padding(24.dp),
                              verticalArrangement = Arrangement.Center,
                              horizontalAlignment = Alignment.CenterHorizontally
                          ) {
                              Text(
                                  "Find identical ${vm.kind.label.lowercase()} \u2014 same size and same content.",
                                  textAlign = TextAlign.Center
                              )
                              Spacer(Modifier.height(16.dp))
                              Button(onClick = { startScan() }) { Text("Scan") }
                          }

                          groups.isEmpty() -> Column(
                              Modifier.fillMaxSize().padding(24.dp),
                              verticalArrangement = Arrangement.Center,
                              horizontalAlignment = Alignment.CenterHorizontally
                          ) {
                              Text("No duplicates found")
                              Spacer(Modifier.height(16.dp))
                              Button(onClick = { startScan() }) { Text("Scan again") }
                          }

                          else -> Column(Modifier.fillMaxSize()) {
                              Row(
                                  Modifier.fillMaxWidth().padding(horizontal = 16.dp),
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Text(
                                      "Tap any file to keep it or mark it for deletion",
                                      fontSize = 12.sp,
                                      color = Color.Gray,
                                      modifier = Modifier.weight(1f)
                                  )
                                  TextButton(onClick = { vm.autoSelect() }) { Text("Auto-select") }
                              }
                              LazyVerticalGrid(
                                  columns = GridCells.Fixed(2),
                                  contentPadding = PaddingValues(12.dp),
                                  horizontalArrangement = Arrangement.spacedBy(10.dp),
                                  verticalArrangement = Arrangement.spacedBy(10.dp),
                                  modifier = Modifier.fillMaxSize()
                              ) {
                                  groups.forEach { g ->
                                      item(
                                          key = "h-" + g.items[0].key,
                                          span = { GridItemSpan(maxLineSpan) }
                                      ) {
                                          val allTicked = g.items.all { it.key in vm.selected }
                                          Column(Modifier.fillMaxWidth().padding(top = 10.dp)) {
                                              Row(verticalAlignment = Alignment.CenterVertically) {
                                                  Text(
                                                      "${g.items.size} Duplicates",
                                                      fontSize = 18.sp,
                                                      fontWeight = FontWeight.Bold
                                                  )
                                                  Spacer(Modifier.width(8.dp))
                                                  Text(fmt(g.size), color = Color.Gray, fontSize = 13.sp)
                                                  Spacer(Modifier.weight(1f))
                                                  TextButton(onClick = { vm.deselectGroup(g) }) {
                                                      Text("Deselect All")
                                                  }
                                              }
                                              if (allTicked) {
                                                  Text(
                                                      "Warning: every copy is ticked",
                                                      color = Color(0xFFFF6B6B),
                                                      fontSize = 12.sp
                                                  )
                                              }
                                          }
                                      }
                                      items(g.items, key = { it.key }) { f ->
                                          Tile(
                                              f = f,
                                              checked = f.key in vm.selected,
                                              loader = loader,
                                              onToggle = { vm.toggle(f.key) }
                                          )
                                      }
                                  }
                              }
                          }
                      }
                  }
              }

              if (confirm) {
                  val lost = if (isDup) groups.count { g -> g.items.all { it.key in vm.selected } } else 0
                  val lostNote = if (lost > 0) {
                      "WARNING: $lost group(s) have EVERY copy ticked, so nothing would be left of those files.\n\n"
                  } else {
                      ""
                  }
                  val waNote = if (vm.overlay == null && vm.kind == Kind.WHATSAPP) {
                      "Deleted WhatsApp media will show as missing inside your chats.\n\n"
                  } else {
                      ""
                  }
                  val folderNote = if (toDelete.any { it.isDir }) {
                      "Some selected items are folders \u2014 deleting one removes everything inside it, and folders always delete permanently (there is nothing to restore).\n\n"
                  } else {
                      ""
                  }
                  AlertDialog(
                      onDismissRequest = { confirm = false },
                      title = { Text("Delete ${toDelete.size} files permanently?") },
                      text = {
                          Text(
                              lostNote + waNote + folderNote +
                                  "Yes = deleted forever.\nNo = moved to the Recycle Bin so you can restore them."
                          )
                      },
                      confirmButton = {
                          Column(Modifier.fillMaxWidth(), horizontalAlignment = Alignment.End) {
                              TextButton(onClick = { confirm = false; doDelete(true) }) {
                                  Text("Yes, delete permanently")
                              }
                              TextButton(onClick = { confirm = false; doDelete(false) }) {
                                  Text("No, move to Recycle Bin")
                              }
                              TextButton(onClick = { confirm = false }) { Text("Cancel") }
                          }
                      }
                  )
              }
          }

          @Composable
          fun ChipRow(content: @Composable RowScope.() -> Unit) {
              Row(
                  modifier = Modifier
                      .fillMaxWidth()
                      .horizontalScroll(rememberScrollState())
                      .padding(horizontal = 12.dp, vertical = 4.dp),
                  horizontalArrangement = Arrangement.spacedBy(8.dp),
