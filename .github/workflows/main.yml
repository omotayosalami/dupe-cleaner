                  viewModelScope.launch {
                      try {
                          val items = withContext(Dispatchers.IO) {
                              if (k == Kind.DOCS) Scanner.listDocs() else Scanner.listMedia(cr, k)
                          }
                          val g = Scanner.findDuplicates(cr, items) { d, t ->
                              progress = "Comparing $d of $t files..."
                          }
                          results = results + (k to g)
                          // Default: keep the oldest copy in each group, tick the rest.
                          selected = selected + g.flatMap { grp -> grp.items.drop(1).map { it.key } }
                      } catch (e: Exception) {
                          progress = "Scan failed: ${e.message}"
                      } finally {
                          scanning = false
                      }
                  }
              }

              fun toggle(key: String) {
                  selected = if (key in selected) selected - key else selected + key
              }

              fun deselectGroup(g: DupGroup) {
                  selected = selected - g.items.map { it.key }.toSet()
              }

              fun autoSelect() {
                  val all = groups.flatMap { g -> g.items.map { it.key } }.toSet()
                  selected = (selected - all) + groups.flatMap { g -> g.items.drop(1).map { it.key } }
              }

              fun removeDeleted(done: List<FileItem>) {
                  val gone = done.map { it.key }.toSet()
                  results = results.mapValues { entry ->
                      entry.value
                          .map { g -> DupGroup(g.size, g.items.filter { it.key !in gone }) }
                          .filter { it.items.size > 1 }
                  }
                  selected = selected - gone
              }
          }

          fun fmt(b: Long): String = when {
              b >= 1_073_741_824L -> "%.1f GB".format(b / 1_073_741_824.0)
              b >= 1_048_576L -> "%.0f MB".format(b / 1_048_576.0)
              else -> "${b / 1024} KB"
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme(colorScheme = darkColorScheme()) {
                          val vm: MainVM = viewModel()
                          App(vm)
                      }
                  }
              }
          }

          @Composable
          fun App(vm: MainVM) {
              val ctx = LocalContext.current
              val groups = vm.groups
              val selectedItems = groups.flatMap { it.items }.filter { it.key in vm.selected }
              val dupFiles = groups.sumOf { it.items.size }
              val dupBytes = groups.sumOf { it.size * it.items.size }
              var confirm by remember { mutableStateOf(false) }
              val loader = remember {
                  ImageLoader.Builder(ctx).components { add(VideoFrameDecoder.Factory()) }.build()
              }

              val deleteLauncher = rememberLauncherForActivityResult(
                  ActivityResultContracts.StartIntentSenderForResult()
              ) { r ->
                  if (r.resultCode == Activity.RESULT_OK) {
                      val n = vm.pending.size
                      val msg = if (vm.pendingTrash) "Moved $n files to Recycle Bin" else "Deleted $n files"
                      vm.removeDeleted(vm.pending)
                      Toast.makeText(ctx, msg, Toast.LENGTH_SHORT).show()
                  }
              }

              val permLauncher = rememberLauncherForActivityResult(
                  ActivityResultContracts.RequestMultiplePermissions()
              ) { res ->
                  if (res.values.all { it }) {
                      vm.scan(ctx.contentResolver)
                  } else {
                      Toast.makeText(ctx, "Storage permission is needed to scan", Toast.LENGTH_LONG).show()
                  }
              }

              fun startScan() {
                  if (vm.kind == Kind.DOCS) {
                      if (Environment.isExternalStorageManager()) {
                          vm.scan(ctx.contentResolver)
                      } else {
                          Toast.makeText(
                              ctx,
                              "Allow 'All files access', then come back and tap Scan again",
                              Toast.LENGTH_LONG
                          ).show()
                          ctx.startActivity(
                              Intent(
                                  Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION,
                                  Uri.parse("package:" + ctx.packageName)
                              )
                          )
                      }
                  } else {
                      val perms = if (Build.VERSION.SDK_INT >= 33) {
                          arrayOf(
                              Manifest.permission.READ_MEDIA_IMAGES,
                              Manifest.permission.READ_MEDIA_VIDEO
                          )
                      } else {
                          arrayOf(Manifest.permission.READ_EXTERNAL_STORAGE)
                      }
                      permLauncher.launch(perms)
                  }
              }

              fun doDelete(permanent: Boolean) {
                  val items = selectedItems
                  if (items.isEmpty()) return
                  vm.pending = items
                  vm.pendingTrash = !permanent
                  if (vm.kind == Kind.DOCS) {
                      val done = items.filter {
                          if (permanent) {
                              val p = it.path
                              p != null && File(p).delete()
                          } else {
                              Scanner.moveToBin(it)
                          }
                      }
                      vm.removeDeleted(done)
                      val msg = if (permanent) "Deleted ${done.size} files"
                      else "Moved ${done.size} files to '${Scanner.BIN_NAME}' folder"
                      Toast.makeText(ctx, msg, Toast.LENGTH_LONG).show()
                  } else {
                      val uris = items.map { it.uri }
                      val pi = if (permanent) {
                          MediaStore.createDeleteRequest(ctx.contentResolver, uris)
                      } else {
                          MediaStore.createTrashRequest(ctx.contentResolver, uris, true)
                      }
                      deleteLauncher.launch(IntentSenderRequest.Builder(pi.intentSender).build())
                  }
              }

              Scaffold(
                  topBar = {
                      Column {
                          Column(Modifier.padding(horizontal = 16.dp, vertical = 12.dp)) {
                              Text("Duplicates", fontSize = 22.sp, fontWeight = FontWeight.Bold)
                              if (vm.scanned && groups.isNotEmpty()) {
                                  Text(
                                      "$dupFiles files \u00B7 ${fmt(dupBytes)}",
                                      fontSize = 13.sp,
                                      color = Color.Gray
                                  )
                              }
                          }
                          TabRow(selectedTabIndex = vm.kind.ordinal) {
                              Kind.values().forEach { k ->
                                  Tab(
                                      selected = vm.kind == k,
                                      onClick = { vm.kind = k },
                                      text = { Text(k.label) }
                                  )
                              }
                          }
                      }
                  },
                  bottomBar = {
                      if (vm.scanned && groups.isNotEmpty() && !vm.scanning) {
                          Button(
                              onClick = { confirm = true },
                              enabled = selectedItems.isNotEmpty(),
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(12.dp)
                                  .height(64.dp)
                          ) {
                              Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                  Text(
                                      "Delete ${selectedItems.size} Duplicates",
                                      fontSize = 17.sp,
                                      fontWeight = FontWeight.Bold
                                  )
                                  Text("(Save ${fmt(selectedItems.sumOf { it.size })})", fontSize = 13.sp)
                              }
                          }
                      }
                  }
              ) { pad ->
                  Box(Modifier.padding(pad).fillMaxSize()) {
                      when {
                          vm.scanning -> Column(
                              Modifier.fillMaxSize(),
                              verticalArrangement = Arrangement.Center,
                              horizontalAlignment = Alignment.CenterHorizontally
                          ) {
                              CircularProgressIndicator()
                              Spacer(Modifier.height(16.dp))
                              Text(vm.progress)
                          }

                          !vm.scanned -> Column(
                              Modifier.fillMaxSize().padding(24.dp),
                              verticalArrangement = Arrangement.Center,
                              horizontalAlignment = Alignment.CenterHorizontally
                          ) {
                              Text(
                                  "Find identical ${vm.kind.label.lowercase()} \u2014 same size and same content.",
                                  textAlign = TextAlign.Center
                              )
                              Spacer(Modifier.height(16.dp))
                              Button(onClick = { startScan() }) { Text("Scan") }
                          }

                          groups.isEmpty() -> Column(
                              Modifier.fillMaxSize().padding(24.dp),
                              verticalArrangement = Arrangement.Center,
                              horizontalAlignment = Alignment.CenterHorizontally
                          ) {
                              Text("No duplicates found")
                              Spacer(Modifier.height(16.dp))
                              Button(onClick = { startScan() }) { Text("Scan again") }
                          }

                          else -> Column(Modifier.fillMaxSize()) {
                              Row(
                                  Modifier.fillMaxWidth().padding(horizontal = 16.dp),
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Text(
                                      "Tap any file to keep it or mark it for deletion",
                                      fontSize = 12.sp,
                                      color = Color.Gray,
                                      modifier = Modifier.weight(1f)
                                  )
                                  TextButton(onClick = { vm.autoSelect() }) { Text("Auto-select") }
                              }
                              LazyVerticalGrid(
                                  columns = GridCells.Fixed(2),
                                  contentPadding = PaddingValues(12.dp),
                                  horizontalArrangement = Arrangement.spacedBy(10.dp),
                                  verticalArrangement = Arrangement.spacedBy(10.dp),
                                  modifier = Modifier.fillMaxSize()
                              ) {
                                  groups.forEach { g ->
                                      item(
                                          key = "h-" + g.items[0].key,
                                          span = { GridItemSpan(maxLineSpan) }
                                      ) {
                                          val allTicked = g.items.all { it.key in vm.selected }
                                          Column(Modifier.fillMaxWidth().padding(top = 10.dp)) {
                                              Row(verticalAlignment = Alignment.CenterVertically) {
                                                  Text(
                                                      "${g.items.size} Duplicates",
                                                      fontSize = 18.sp,
                                                      fontWeight = FontWeight.Bold
                                                  )
                                                  Spacer(Modifier.width(8.dp))
                                                  Text(fmt(g.size), color = Color.Gray, fontSize = 13.sp)
                                                  Spacer(Modifier.weight(1f))
                                                  TextButton(onClick = { vm.deselectGroup(g) }) {
                                                      Text("Deselect All")
                                                  }
                                              }
                                              if (allTicked) {
                                                  Text(
                                                      "Warning: every copy is ticked",
                                                      color = Color(0xFFFF6B6B),
                                                      fontSize = 12.sp
                                                  )
                                              }
                                          }
                                      }
                                      items(g.items, key = { it.key }) { f ->
                                          Tile(
                                              f = f,
                                              checked = f.key in vm.selected,
                                              loader = loader,
                                              onToggle = { vm.toggle(f.key) }
                                          )
                                      }
                                  }
                              }
                          }
                      }
                  }
              }

              if (confirm) {
                  val lost = groups.count { g -> g.items.all { it.key in vm.selected } }
                  AlertDialog(
                      onDismissRequest = { confirm = false },
                      title = { Text("Delete ${selectedItems.size} files permanently?") },
                      text = {
                          Text(
                              (if (lost > 0) {
                                  "WARNING: $lost group(s) have EVERY copy ticked, so nothing would be left of those files.\n\n"
                              } else {
                                  ""
                              }) +
                                  "Yes = deleted forever.\nNo = moved to the Recycle Bin so you can restore them."
                          )
                      },
                      confirmButton = {
                          Column(Modifier.fillMaxWidth(), horizontalAlignment = Alignment.End) {
                              TextButton(onClick = { confirm = false; doDelete(true) }) {
                                  Text("Yes, delete permanently")
                              }
                              TextButton(onClick = { confirm = false; doDelete(false) }) {
                                  Text("No, move to Recycle Bin")
                              }
                              TextButton(onClick = { confirm = false }) { Text("Cancel") }
                          }
                      }
                  )
              }
          }

          @Composable
          fun Tile(f: FileItem, checked: Boolean, loader: ImageLoader, onToggle: () -> Unit) {
              Box(
                  Modifier
                      .aspectRatio(1f)
                      .clip(RoundedCornerShape(16.dp))
                      .background(Color(0xFF2B2F36))
                      .clickable { onToggle() }
              ) {
                  if (f.kind == Kind.DOCS) {
                      Column(
                          Modifier.fillMaxSize().padding(8.dp),
                          verticalArrangement = Arrangement.Center,
                          horizontalAlignment = Alignment.CenterHorizontally
                      ) {
                          Text(
                              f.name.substringAfterLast('.', "").uppercase(),
                              fontSize = 28.sp,
                              fontWeight = FontWeight.Bold
                          )
                      }
                  } else {
                      AsyncImage(
                          model = f.uri,
                          imageLoader = loader,
                          contentDescription = f.name,
                          contentScale = ContentScale.Crop,
                          modifier = Modifier.fillMaxSize()
                      )
                  }
                  if (checked) {
                      Box(Modifier.fillMaxSize().background(Color(0x33FF3B30)))
                  }
                  Text(
                      f.name,
                      fontSize = 10.sp,
                      maxLines = 1,
                      overflow = TextOverflow.Ellipsis,
                      color = Color.White,
                      modifier = Modifier
                          .align(Alignment.BottomStart)
                          .padding(start = 8.dp, bottom = 14.dp)
                          .width(90.dp)
                          .background(Color(0x99000000))
                  )
                  Checkbox(
                      checked = checked,
                      onCheckedChange = { onToggle() },
                      colors = CheckboxDefaults.colors(checkedColor = Color(0xFFE53935)),
                      modifier = Modifier.align(Alignment.BottomEnd)
                  )
              }
          }
          __EOF__
          base64 -d app/fixed.b64 > app/fixed.jks

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Keep APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DupeCleaner-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build
          name: Dupe Cleaner APK
          files: app/build/outputs/apk/debug/app-debug.apk
