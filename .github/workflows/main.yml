          @Composable
          fun Chip(label: String, selected: Boolean, onClick: () -> Unit) {
              Box(
                  Modifier
                      .clip(RoundedCornerShape(50))
                      .background(if (selected) Color(0xFF1565C0) else Color(0xFF2B2F36))
                      .clickable { onClick() }
                      .padding(horizontal = 14.dp, vertical = 8.dp)
              ) {
                  Text(label, fontSize = 13.sp, color = Color.White)
              }
          }

          @Composable
          fun FileRow(f: FileItem, checked: Boolean, loader: ImageLoader, onToggle: () -> Unit) {
              val folder = (f.path ?: "").substringBeforeLast('/').removePrefix("/storage/emulated/0/")
              Row(
                  Modifier
                      .fillMaxWidth()
                      .clickable { onToggle() }
                      .padding(horizontal = 12.dp, vertical = 6.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Box(
                      Modifier
                          .size(56.dp)
                          .clip(RoundedCornerShape(10.dp))
                          .background(Color(0xFF2B2F36)),
                      contentAlignment = Alignment.Center
                  ) {
                      if (f.isDir) {
                          Text("\uD83D\uDCC1", fontSize = 20.sp)
                      } else if (f.isVisual) {
                          AsyncImage(
                              model = f.uri,
                              imageLoader = loader,
                              contentDescription = f.name,
                              contentScale = ContentScale.Crop,
                              modifier = Modifier.fillMaxSize()
                          )
                      } else {
                          Text(f.ext.uppercase().take(4), fontSize = 12.sp, fontWeight = FontWeight.Bold)
                      }
                  }
                  Spacer(Modifier.width(12.dp))
                  Column(Modifier.weight(1f)) {
                      Text(f.name, maxLines = 1, overflow = TextOverflow.Ellipsis, fontSize = 14.sp)
                      Text(
                          "${fmt(f.size)} \u00B7 ${dateText(f.date)}",
                          fontSize = 12.sp,
                          color = Color.Gray
                      )
                      Text(
                          folder,
                          maxLines = 1,
                          overflow = TextOverflow.Ellipsis,
                          fontSize = 11.sp,
                          color = Color.Gray
                      )
                  }
                  Checkbox(
                      checked = checked,
                      onCheckedChange = { onToggle() },
                      colors = CheckboxDefaults.colors(checkedColor = Color(0xFFE53935))
                  )
              }
          }

