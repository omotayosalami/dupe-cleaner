          @Composable
          fun CacheView(vm: MainVM, onScan: () -> Unit) {
              val ctx = LocalContext.current
              if (!vm.hasUsageAccess) {
                  Column(
                      Modifier.fillMaxSize().padding(24.dp),
                      verticalArrangement = Arrangement.Center,
                      horizontalAlignment = Alignment.CenterHorizontally
                  ) {
                      Text(
                          "See a full per-app storage breakdown \u2014 app size, saved data, and cache \u2014 " +
                              "just like Settings > Apps, without leaving Dupe Cleaner. Android still only " +
                              "lets an app manage its OWN storage, so clearing happens on each app's own " +
                              "Settings page, one tap away from here.",
                          textAlign = TextAlign.Center
                      )
                      Spacer(Modifier.height(16.dp))
                      Text(
                          "That needs one extra permission first: \"Usage access\".",
                          textAlign = TextAlign.Center,
                          fontSize = 13.sp,
                          color = Color.Gray
                      )
                      Spacer(Modifier.height(16.dp))
                      Button(onClick = {
                          ctx.startActivity(Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS))
                      }) { Text("Grant usage access") }
                  }
                  return
              }
              if (!vm.cacheScanned) {
                  Column(
                      Modifier.fillMaxSize().padding(24.dp),
                      verticalArrangement = Arrangement.Center,
                      horizontalAlignment = Alignment.CenterHorizontally
                  ) {
                      Text(
                          "List every app's total storage \u2014 app, data, and cache \u2014 biggest first.",
                          textAlign = TextAlign.Center
                      )
                      Spacer(Modifier.height(16.dp))
                      Button(onClick = onScan) { Text("Check app storage") }
                  }
                  return
              }
              Column(Modifier.fillMaxSize()) {
                  Row(
                      Modifier.fillMaxWidth().padding(horizontal = 16.dp, vertical = 8.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Text(
                          "Total: ${fmt(vm.cacheApps.sumOf { it.totalBytes })} across ${vm.cacheApps.size} apps",
                          fontSize = 13.sp,
                          color = Color.Gray,
                          modifier = Modifier.weight(1f)
                      )
                      TextButton(onClick = onScan) { Text("Rescan") }
                  }
                  if (vm.cacheApps.isEmpty()) {
                      Text(
                          "No app storage found.",
                          modifier = Modifier.padding(24.dp),
                          color = Color.Gray
                      )
                  } else {
                      LazyColumn(Modifier.fillMaxSize()) {
                          items(vm.cacheApps, key = { it.packageName }) { app ->
                              Column(
                                  Modifier.fillMaxWidth().padding(horizontal = 16.dp, vertical = 10.dp)
                              ) {
                                  Row(verticalAlignment = Alignment.CenterVertically) {
                                      Column(Modifier.weight(1f)) {
                                          Text(
                                              app.label,
                                              fontSize = 14.sp,
                                              maxLines = 1,
                                              overflow = TextOverflow.Ellipsis
                                          )
                                          Text(
                                              fmt(app.totalBytes),
                                              fontSize = 13.sp,
                                              fontWeight = FontWeight.Bold,
                                              color = Color.Gray
                                          )
                                      }
                                      TextButton(onClick = {
                                          ctx.startActivity(
                                              Intent(
                                                  Settings.ACTION_APPLICATION_DETAILS_SETTINGS,
                                                  Uri.parse("package:" + app.packageName)
                                              )
                                          )
                                      }) { Text("Manage") }
                                  }
                                  Spacer(Modifier.height(2.dp))
                                  Text(
                                      "App ${fmt(app.appBytes)} \u00B7 Data ${fmt(app.dataBytes)} \u00B7 Cache ${fmt(app.cacheBytes)}",
                                      fontSize = 11.sp,
                                      color = Color.Gray
                                  )
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun DashboardView(vm: MainVM, onScan: () -> Unit) {
              val ctx = LocalContext.current
              Column(Modifier.fillMaxSize().padding(20.dp)) {
                  Text(
                      "Total freed with this app: ${fmt(vm.freedBytes)}",
                      fontSize = 15.sp,
                      fontWeight = FontWeight.Bold
                  )
                  Spacer(Modifier.height(20.dp))
                  if (!vm.dashScanned) {
                      Column(
                          Modifier.fillMaxWidth(),
                          horizontalAlignment = Alignment.CenterHorizontally
                      ) {
                          Text(
                              "See how your storage breaks down across Photos, Videos, Music, Documents, WhatsApp, Junk, and Apps.",
                              textAlign = TextAlign.Center
                          )
                          Spacer(Modifier.height(16.dp))
                          if (!vm.hasUsageAccess) {
                              Text(
                                  "Grant \"Usage access\" first so the Apps slice (every app's install + data + " +
                                      "cache) can be included \u2014 without it, that slice will show as 0.",
                                  textAlign = TextAlign.Center,
                                  fontSize = 12.sp,
                                  color = Color.Gray
                              )
                              Spacer(Modifier.height(12.dp))
                              TextButton(onClick = {
                                  ctx.startActivity(Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS))
                              }) { Text("Grant usage access") }
                              Spacer(Modifier.height(4.dp))
                          }
                          Button(onClick = onScan) { Text("Scan storage") }
                      }
                  } else {
                      val total = vm.dashCounts.values.sum().coerceAtLeast(1L)
                      val colors = listOf(
                          Color(0xFF1565C0), Color(0xFF2E7D32), Color(0xFFF9A825),
                          Color(0xFF6A1B9A), Color(0xFFC62828), Color(0xFF00838F),
                          Color(0xFF8D6E63)
                      )
                      val entries = vm.dashCounts.entries.sortedByDescending { it.value }
                      entries.forEachIndexed { i, (label, bytes) ->
                          val frac = bytes.toFloat() / total.toFloat()
                          Column(Modifier.padding(bottom = 14.dp)) {
                              Row(Modifier.fillMaxWidth()) {
                                  Text(label, fontSize = 13.sp, modifier = Modifier.weight(1f))
                                  Text(fmt(bytes), fontSize = 13.sp, color = Color.Gray)
                              }
                              Spacer(Modifier.height(4.dp))
                              Box(
                                  Modifier
                                      .fillMaxWidth()
                                      .height(10.dp)
                                      .clip(RoundedCornerShape(6.dp))
                                      .background(Color(0xFF2B2F36))
                              ) {
                                  Box(
                                      Modifier
                                          .fillMaxWidth(frac.coerceIn(0f, 1f))
                                          .fillMaxHeight()
                                          .clip(RoundedCornerShape(6.dp))
                                          .background(colors[i % colors.size])
                                  )
                              }
                          }
                      }
                      if (!vm.hasUsageAccess) {
                          Text(
                              "Apps slice is 0 \u2014 grant Usage Access, then rescan, to include every app's " +
                                  "install + data + cache.",
                              fontSize = 12.sp,
                              color = Color.Gray
                          )
                          Spacer(Modifier.height(8.dp))
                      }
                      TextButton(onClick = onScan) { Text("Rescan") }
                  }
              }
          }

          @Composable
          fun Tile(f: FileItem, checked: Boolean, loader: ImageLoader, onToggle: () -> Unit) {
              Box(
                  Modifier
                      .aspectRatio(1f)
                      .clip(RoundedCornerShape(16.dp))
                      .background(Color(0xFF2B2F36))
                      .clickable { onToggle() }
              ) {
                  if (f.kind == Kind.DOCS || f.kind == Kind.MUSIC) {
                      Column(
                          Modifier.fillMaxSize().padding(8.dp),
                          verticalArrangement = Arrangement.Center,
                          horizontalAlignment = Alignment.CenterHorizontally
                      ) {
                          Text(
                              f.name.substringAfterLast('.', "").uppercase(),
                              fontSize = 28.sp,
                              fontWeight = FontWeight.Bold
                          )
                      }
                  } else {
                      AsyncImage(
                          model = f.uri,
                          imageLoader = loader,
                          contentDescription = f.name,
                          contentScale = ContentScale.Crop,
                          modifier = Modifier.fillMaxSize()
                      )
                  }
                  if (checked) {
                      Box(Modifier.fillMaxSize().background(Color(0x33FF3B30)))
                  }
                  Text(
                      f.name,
                      fontSize = 10.sp,
                      maxLines = 1,
                      overflow = TextOverflow.Ellipsis,
                      color = Color.White,
                      modifier = Modifier
                          .align(Alignment.BottomStart)
                          .padding(start = 8.dp, bottom = 14.dp)
                          .width(90.dp)
                          .background(Color(0x99000000))
                  )
                  Checkbox(
                      checked = checked,
                      onCheckedChange = { onToggle() },
                      colors = CheckboxDefaults.colors(checkedColor = Color(0xFFE53935)),
                      modifier = Modifier.align(Alignment.BottomEnd)
                  )
              }
          }
          __EOF__
          base64 -d app/fixed.b64 > app/fixed.jks

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Keep APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DupeCleaner-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build
          name: Dupe Cleaner APK
          files: app/build/outputs/apk/debug/app-debug.apk
